    <title>Learning Material - Adaptive Learning</title>
    <link rel="stylesheet" href="css/learning-material.css">
</head>
<body>
    <header>

        <nav>

        <p id="recommendation"></p>

    <script>
        const userName = 'user_name'; // Replace with the actual user name

        fetch(`recommend.php?user_name=${userName}`)

            .then(data => {
                document.getElementById('recommendation').textContent = data.recommendation;
            });
    </script>
